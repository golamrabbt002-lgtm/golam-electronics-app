<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golam Electronics</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172554;
    }
    header {
      background: #075985;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }
    nav {
      background: #0c4a6e;
      padding: 12px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 10px;
      text-decoration: none;
    }
    main {
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 25px;
      margin: 15px auto;
      border-radius: 12px;
      max-width: 450px;
      box-shadow: 0 2px 8px #0002;
    }
  </style>
</head>
<body>
  <header>
    <h1>Golam Electronics</h1>
    <p>আপনাকে স্বাগতম</p>
  </header>

  <nav>
    <a href="#home">হোম</a>
    <a href="#services">সেবা</a>
    <a href="#contact">যোগাযোগ</a>
  </nav>

  <main id="home">
    <div class="card">
      <h2>আমাদের ওয়েবসাইটে স্বাগতম</h2>
      <p>ইলেকট্রনিক্স সম্পর্কিত সকল তথ্য ও সেবা এখানে পাবেন।</p>
    </div>

    <div class="card" id="services">
      <h2>আমাদের সেবা</h2>
      <p>ইলেকট্রনিক্স পণ্য ও বিভিন্ন সেবা</p>
    </div>

    <div class="card" id="contact">
      <h2>যোগাযোগ</h2>
      <p>Golam Electronics</p>
    </div>
  </main>
</body>
</html>
